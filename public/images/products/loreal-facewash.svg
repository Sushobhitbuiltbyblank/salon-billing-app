<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="facewashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="capGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>
  <!-- Background Glow Circle -->
  <circle cx="50" cy="50" r="46" fill="#083344" opacity="0.4" />

  <!-- Tube Cap (at bottom) -->
  <rect x="41" y="78" width="18" height="12" rx="3" fill="url(#capGradCyan)" stroke="#0891b2" stroke-width="1.2" />

  <!-- Tube Neck -->
  <path d="M44 74 L56 74 L57 78 L43 78 Z" fill="#64748b" />

  <!-- Tube Body (inverted skincare squeeze tube) -->
  <path d="M34 16 L66 16 L64 74 L36 74 Z" fill="url(#facewashGrad)" stroke="#22d3ee" stroke-width="1.5" />
  
  <!-- Tube Crimp Top -->
  <rect x="33" y="12" width="34" height="6" rx="1.5" fill="#0e7490" stroke="#22d3ee" stroke-width="1" />
  <line x1="36" y1="14" x2="64" y2="14" stroke="rgba(255,255,255,0.4)" stroke-width="1" />

  <!-- Tube Gloss / Highlight -->
  <path d="M38 20 L40 68" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Label Details -->
  <rect x="40" y="32" width="20" height="26" rx="2" fill="#ffffff" />
  <text x="50" y="40" font-family="sans-serif" font-size="4.8" font-weight="900" text-anchor="middle" fill="#0e7490">L'ORÉAL</text>
  <text x="50" y="46" font-family="sans-serif" font-size="3" font-weight="700" text-anchor="middle" fill="#0891b2">FACEWASH</text>
  <path d="M47 50 Q50 48 53 50 Q50 54 47 50 Z" fill="#06b6d4" />
  <text x="50" y="56" font-family="sans-serif" font-size="2.2" font-weight="600" text-anchor="middle" fill="#64748b">PURIFYING</text>

  <!-- Water Droplets & Glow -->
  <path d="M72 45 Q75 42 78 45 Q75 50 72 45 Z" fill="#38bdf8" opacity="0.9" />
  <path d="M25 52 Q28 49 31 52 Q28 57 25 52 Z" fill="#67e8f9" opacity="0.8" />
  <circle cx="73" cy="30" r="2.5" fill="#a5f3fc" opacity="0.8" />
</svg>
